<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сөздік қазынасы — квест</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf3dc;--card:#fffaf0;--ink:#3b2a14;--acc:#c0392b;--gold:#d4a017;--ok:#2e8b57;--bad:#c0392b;--line:#e3cf9f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1710;--card:#2a2016;--ink:#f5e7c8;--acc:#e8735f;--gold:#f0c040;--ok:#58c98a;--bad:#ff7b6b;--line:#4a3a22}}
:root[data-theme="dark"]{--bg:#1d1710;--card:#2a2016;--ink:#f5e7c8;--acc:#e8735f;--gold:#f0c040;--ok:#58c98a;--bad:#ff7b6b;--line:#4a3a22}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:16px}
h1,h2{margin:.3em 0}.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:bold;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--gold);color:#2b1d00;border-radius:12px;padding:10px 16px;font-weight:bold}
button:hover{filter:brightness(1.08)}
input{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;margin:8px 0}
.map{display:flex;gap:6px;justify-content:space-between;margin:10px 0}
.node{flex:1;text-align:center;padding:8px 2px;border-radius:12px;border:2px dashed var(--line);font-size:.85rem}
.node.done{background:var(--ok);color:#fff;border-style:solid}.node.cur{border-color:var(--acc);border-style:solid;font-weight:bold}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--bg);color:var(--ink);border-color:var(--line)}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg);display:none}
.big{font-size:3rem;text-align:center}.c{text-align:center}
</style></head><body><main id="app"></main>
<script>
const L=[
{n:"Қала қақпасы",i:"🏰",s:"Сөздік қор деген не? Қақпаны ашу үшін 3 сұраққа жауап бер!",q:[
["Тілдегі барлық сөздердің жиынтығы қалай аталады?","Сөздік қор","Сөз тіркесі","Сөйлем","Мәтін","Тілдің барлық сөздерінің жиынтығы — сөздік қор (лексика)."],
["Сөздің мағынасын түсіндіретін кітап қалай аталады?","Түсіндірме сөздік","Емле сөздігі","Мақал-мәтел жинағы","Энциклопедия","Түсіндірме сөздікте сөздің лексикалық мағынасы беріледі."],
["Сөздің лексикалық мағынасы дегеніміз не?","Сөздің білдіретін нақты ұғымы","Сөздің буын саны","Сөздің жазылуы","Сөздегі дыбыс саны","Лексикалық мағына — сөздің атайтын заты, құбылысы, ұғымы."]]},
{n:"Мағына орманы",i:"🌲",s:"Орманда сөздердің мағыналары адастырады. Тура, ауыспалы, көп мағынаны ажырат!",q:[
["Қай сөйлемде сөз ауыспалы мағынада қолданылған?","Ол — алтын қолды шебер.","Алтын жүзік сатып алдық.","Алтын бұйымдар сөреде тұр.","Алтын сағат тоқтап қалды.","«Алтын қол» — шебер деген ауыспалы мағына."],
["Көп мағыналы сөзді тап:","Тіл","Кітап","Дәптер","Мектеп","«Тіл» — ауыздағы мүше де, сөйлеу тілі де."],
["Омонимдер жұбын тап:","жаз (мезгіл) – жаз (етістік)","үлкен – кішкентай","жақсы – игі","жүр – бар","Омонимдер — жазылуы, айтылуы бірдей, мағынасы әртүрлі сөздер."]]},
{n:"Синоним-антоним көпірі",i:"🌉",s:"Көпірден өту үшін ұқсас және қарама-қарсы сөздерді тап!",q:[
["«Батыл» сөзінің синонимі қайсы?","Ержүрек","Қорқақ","Жалқау","Ақылсыз","Синонимдер — мағынасы жақын сөздер."],
["«Ащы» сөзінің антонимі қайсы?","Тәтті","Тұзды","Қара","Ыстық","Антонимдер — мағынасы қарама-қарсы сөздер."],
["Қай жұп антоним?","биік – аласа","көркем – әдемі","жүр – бар","жылдам – тез","Биік пен аласа — қарама-қарсы мағына."]]},
{n:"Төл және кірме сөздер қамалы",i:"🏯",s:"Қамалда төл сөздер мен кірме сөздерді ажыратуың керек!",q:[
["Қайсысы кірме сөз?","Компьютер","Тау","Көл","Бала","Компьютер — басқа тілден енген сөз."],
["Қайсысы қазақтың төл сөзі?","Жылқы","Телевизор","Институт","Лифт","Жылқы — төл сөз, ежелден келе жатқан."],
["«Самолёт» кірме сөзінің қазақша баламасы:","ұшақ","пойыз","кеме","көлік","Кірме сөздің орнына қазақша балама қолданған дұрыс."]]},
{n:"Соңғы қазына үңгірі",i:"💎",s:"Қолданылу аясы шектеулі сөздер мен фразеологизмдер — соңғы сынақ!",q:[
["Диалектизм дегеніміз не?","Белгілі бір жерде ғана айтылатын сөз","Ескірген сөз","Ғылым термині","Жаңа шыққан сөз","Диалектизм — жергілікті ерекшелікті сөз."],
["Қайсысы термин?","Етістік","Көңіл","Бақыт","Дос","Етістік — тіл білімінің термині."],
["«Тілін тістеді» тіркесінің мағынасы:","Үндемей қалды","Тісі ауырды","Тамақ жеді","Қатты күлді","Бұл — фразеологизм, мағынасы тұтас."]]}
];
const A=document.getElementById("app");
let S={name:"",lv:0,qi:0,hp:5,xp:0,tries:0};
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function hud(){return `<div class="top"><span>🧙 ${S.name||"Саяхатшы"}</span><span>❤️ ${S.hp}</span><span>⭐ ${S.xp} ұпай</span></div><div class="map">${L.map((l,i)=>`<div class="node ${i<S.lv?"done":i==S.lv?"cur":""}">${i<S.lv?"✅":l.i}<br>${i+1}</div>`).join("")}</div>`}
function start(){A.innerHTML=`<div class="card c"><div class="big">🗺️</div><h1>Сөздік қазынасы</h1><p>8-сынып · Сөздік қор және сөздік құрам</p><p>5 қиын аймақтан өтіп, жасырын қазынаны тап! Әр қате жауап — бір жүрек.</p><input id="nm" placeholder="Есіміңді жаз" maxlength="25"><button onclick="go()">Квестті бастау ▶</button></div>`}
function go(){S={name:document.getElementById("nm").value.trim()||"Саяхатшы",lv:0,qi:0,hp:5,xp:0,tries:0};intro()}
function intro(){const l=L[S.lv];A.innerHTML=hud()+`<div class="card c"><div class="big">${l.i}</div><h2>${S.lv+1}-деңгей: ${l.n}</h2><p>${l.s}</p><button onclick="ask()">Кіру →</button></div>`}
function ask(){const l=L[S.lv],q=l.q[S.qi];S.tries=0;
A.innerHTML=hud()+`<div class="card"><div class="bar"><i style="width:${S.qi/3*100}%"></i></div><p><b>${l.i} ${l.n} · ${S.qi+1}/3</b></p><h2>${q[0]}</h2><div id="o">${sh(q.slice(1,5)).map(t=>`<button class="opt" data-t="${t.replace(/"/g,"&quot;")}">${t}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b))}
function pick(b){const q=L[S.lv].q[S.qi],fb=document.getElementById("fb");fb.style.display="block";
if(b.dataset.t===q[1]){b.classList.add("ok");if(!S.tries)S.xp+=10;document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
fb.innerHTML=`✅ Дұрыс! ${q[5]}<br><br><button onclick="next()">Әрі қарай →</button>`}
else{b.classList.add("bad");b.disabled=true;S.tries++;S.hp--;
if(S.hp<=0){fb.innerHTML=`💔 Жүректер таусылды. Деңгейді қайта бастайық!<br><br><button onclick="S.hp=5;S.qi=0;S.tries=0;intro()">Қайта бастау</button>`;document.querySelectorAll(".opt").forEach(x=>x.disabled=true)}
else fb.innerHTML=`❌ Қате. Тағы байқап көр! (❤️ ${S.hp})`;
const t=document.querySelector(".top");if(t)t.children[1].textContent="❤️ "+S.hp}}
function next(){S.qi++;if(S.qi>=3){S.qi=0;S.lv++;S.hp=Math.min(5,S.hp+1);if(S.lv>=L.length)return end();
A.innerHTML=hud()+`<div class="card c"><div class="big">🔑</div><h2>Деңгей өтілді!</h2><p>Саған кілт беріледі. Келесі аймаққа бет алдық!</p><button onclick="intro()">Жалғастыру →</button></div>`}else ask()}
function end(){const r=S.xp>=140?"Сөздік қордың патшасы 👑":S.xp>=100?"Тіл білгіш 🏅":"Жас зерттеуші 🌱";
A.innerHTML=`<div class="card c"><div class="big">🏆</div><h1>Қазына табылды!</h1><p><b>${S.name}</b>, сен квестті аяқтадың!</p><p>Ұпай: <b>${S.xp}</b> / 150</p><h2>${r}</h2><button onclick="start()">Қайта ойнау</button></div>`}
start();
</script></body></html>
